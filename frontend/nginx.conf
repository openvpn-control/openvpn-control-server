server {
    listen 8080;
    listen [::]:8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    types {
        application/javascript js mjs;
        text/javascript js mjs;
        text/css css;
    }

    add_header Content-Security-Policy "default-src * data: blob: filesystem:; script-src * 'unsafe-inline' 'unsafe-eval'; style-src * 'unsafe-inline'; font-src * data:; img-src * data: blob: *; connect-src *; object-src *; base-uri *; frame-ancestors *; form-action *; media-src *;" always;
    add_header Permissions-Policy "accelerometer=*, camera=*, geolocation=*, gyroscope=*, magnetometer=*, microphone=*, payment=*, usb=*" always;
    add_header Cross-Origin-Opener-Policy "unsafe-none" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://backend:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
        return 204;
    }

    # Сборка Vite (путь /static/, не /assets/ — меньше ложных блокировок в Firefox)
    location /static/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        types {
            application/javascript js mjs;
            text/css css;
        }
    }

    # Старый путь после пересборки — явный 404 вместо index.html
    location /assets/ {
        return 404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
