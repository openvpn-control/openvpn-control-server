# Прямой доступ к панели на :5173 (без edge nginx). Использование:
#   docker compose -f docker-compose.yml -f docker-compose.direct.yml up --build

services:
  frontend:
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    environment:
      API_URL: ${API_URL:-http://localhost:5173}

  nginx:
    profiles:
      - edge
