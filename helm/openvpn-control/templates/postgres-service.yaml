apiVersion: v1
kind: Service
metadata:
  name: {{ include "openvpn-control.fullname" . }}-postgres
spec:
  type: {{ .Values.postgres.service.type }}
  selector:
    app: {{ include "openvpn-control.fullname" . }}-postgres
  ports:
    - port: {{ .Values.postgres.service.port }}
      targetPort: 5432
