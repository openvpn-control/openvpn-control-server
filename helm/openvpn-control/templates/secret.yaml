apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openvpn-control.fullname" . }}-secret
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "postgres.password is required" .Values.postgres.password | quote }}
  JWT_SECRET: {{ required "backend.jwtSecret is required" .Values.backend.jwtSecret | quote }}
  INIT_ADMIN_PASSWORD: {{ required "backend.initAdminPassword is required" .Values.backend.initAdminPassword | quote }}
