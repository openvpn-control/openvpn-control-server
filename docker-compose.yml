services:
  postgres:
    image: postgres:16-alpine
    container_name: ovpn-postgres
    environment:
      POSTGRES_DB: openvpn_control
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openvpn_control"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    container_name: ovpn-backend
    depends_on:
      postgres:
        condition: service_healthy
    # Иначе схема БД отстаёт от prisma/schema (например Admin.totpEnabled) и клиент падает с P2022.
    command: ["sh", "-c", "npx prisma migrate deploy && node prisma/seed.js && node src/index.js"]
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/openvpn_control?schema=public
      JWT_SECRET: super_secret_replace_in_prod
      PANEL_BACKUP_DIR: /app/data/panel-backups
      # Фронт (Vite / контейнер frontend:5173→80): CORS/CSRF. Host — как в запросе к API с хоста (не origin страницы).
      CORS_ORIGIN: http://localhost:5173
      CSRF_TRUSTED_ORIGINS: http://localhost:5173
      CSRF_PROTECTION_ENABLED: "true"
      ALLOWED_HOSTS: localhost:8080,127.0.0.1:8080
      MFA_PENDING_TOKEN_EXPIRES_IN: 5m
      LOGIN_MAX_ATTEMPTS: "8"
      LOGIN_LOCKOUT_MINUTES: "15"
      AGENT_SYNC_INTERVAL_MS: 2000
      AGENT_METRIC_HISTORY_MINUTES: 15
      CLIENT_TRAFFIC_HISTORY_MINUTES: 15
      INIT_ADMIN_USERNAME: admin
      INIT_ADMIN_PASSWORD: admin123
    ports:
      - "8080:8080"
    volumes:
      - panel_backups_data:/app/data/panel-backups

  frontend:
    build:
      context: ./frontend
    container_name: ovpn-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
  panel_backups_data:
