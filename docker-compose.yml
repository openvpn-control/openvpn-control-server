# Postgres + edge nginx + backend + frontend.
# Запуск: docker compose up --build
# HTTPS + certbot: docker compose --profile ssl up --build

name: openvpn-control-server-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: ovc-server-postgres-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openvpn_control}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-openvpn_control}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: ovc-server-backend-dev
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - panel_backups_dev:/app/data/panel-backups
    expose:
      - "${BACKEND_PORT:-8080}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health | grep -q ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 45s
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-openvpn_control}?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me}
      INIT_ADMIN_USERNAME: ${INIT_ADMIN_USERNAME:-admin}
      INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD:-admin123}
      PANEL_BACKUP_DIR: /app/data/panel-backups
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost,http://127.0.0.1,http://ovp-control-console,https://localhost}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1,http://ovp-control-console,https://localhost}
      CSRF_PROTECTION_ENABLED: ${CSRF_PROTECTION_ENABLED:-true}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-8}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-15}
      AGENT_SYNC_INTERVAL_MS: ${AGENT_SYNC_INTERVAL_MS:-2000}
      OPENVPN_INFO_SYNC_INTERVAL_MS: ${OPENVPN_INFO_SYNC_INTERVAL_MS:-5000}
      CLIENT_SYNC_INTERVAL_MS: ${CLIENT_SYNC_INTERVAL_MS:-2000}
      CLIENT_SESSION_FRESHNESS_SECONDS: ${CLIENT_SESSION_FRESHNESS_SECONDS:-15}
      CLIENT_TRAFFIC_HISTORY_MINUTES: ${CLIENT_TRAFFIC_HISTORY_MINUTES:-15}
      AGENT_METRIC_HISTORY_MINUTES: ${AGENT_METRIC_HISTORY_MINUTES:-15}
      DEPS_REFRESH: ${DEPS_REFRESH:-0}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ovc-server-frontend
    depends_on:
      - backend
    environment:
      API_URL: ${PUBLIC_BASE_URL:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ | grep -q OpenVPN"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: ovc-edge-nginx
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      CERTBOT_PRIMARY_DOMAIN: ${CERTBOT_PRIMARY_DOMAIN:-localhost}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-}
      CERTBOT_STAGING: ${CERTBOT_STAGING:-0}
    volumes:
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    restart: unless-stopped

volumes:
  postgres_data_dev:
  panel_backups_dev:
  certbot_www:
  letsencrypt:
