# Собирает backend и frontend и публикует образы в GitHub Container Registry (ghcr.io).
# Опционально зеркалирует те же манифесты в Docker Hub (без повторной сборки).
#
# Триггеры: push тега v* или workflow_dispatch.
#
# Настройка Docker Hub (репозиторий → Settings → Secrets and variables → Actions):
#   Variables: DOCKERHUB_IMAGE_PREFIX = myuser/openvpn-control   (образы: ...-backend / ...-frontend)
#   Secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
#
# GHCR: ghcr.io/<owner>/<repo>-backend и ghcr.io/<owner>/<repo>-frontend

name: Docker publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Тег образов (например v1.0.0 или latest)"
        required: true
        default: "latest"

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image names (GHCR, lowercase)
        run: |
          owner_repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_BACKEND=${{ env.REGISTRY }}/${owner_repo}-backend" >> "$GITHUB_ENV"
          echo "IMAGE_FRONTEND=${{ env.REGISTRY }}/${owner_repo}-frontend" >> "$GITHUB_ENV"

      - name: Optional Docker Hub targets
        id: hub
        run: |
          prefix="${{ vars.DOCKERHUB_IMAGE_PREFIX }}"
          if [ -n "$prefix" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "backend=docker.io/${prefix}-backend" >> "$GITHUB_OUTPUT"
            echo "frontend=docker.io/${prefix}-frontend" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub (optional)
        if: steps.hub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta (backend)
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BACKEND }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.value }}
            type=raw,value=latest,enable=${{ startsWith(steps.tag.outputs.value, 'v') }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker meta (frontend)
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_FRONTEND }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.value }}
            type=raw,value=latest,enable=${{ startsWith(steps.tag.outputs.value, 'v') }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Mirror to Docker Hub (optional)
        if: steps.hub.outputs.enabled == 'true'
        env:
          TAG: ${{ steps.tag.outputs.value }}
          SRC_BACKEND: ${{ env.IMAGE_BACKEND }}
          SRC_FRONTEND: ${{ env.IMAGE_FRONTEND }}
          DST_BACKEND: ${{ steps.hub.outputs.backend }}
          DST_FRONTEND: ${{ steps.hub.outputs.frontend }}
        run: |
          set -eux
          docker buildx imagetools create --tag "${DST_BACKEND}:${TAG}" "${SRC_BACKEND}:${TAG}"
          docker buildx imagetools create --tag "${DST_FRONTEND}:${TAG}" "${SRC_FRONTEND}:${TAG}"
          if [[ "${TAG}" == v* ]]; then
            docker buildx imagetools create --tag "${DST_BACKEND}:latest" "${SRC_BACKEND}:${TAG}"
            docker buildx imagetools create --tag "${DST_FRONTEND}:latest" "${SRC_FRONTEND}:${TAG}"
          fi
