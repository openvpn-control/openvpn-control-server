# Собирает backend (Go) и frontend, публикует в GHCR.
# Теги образов:
#   - push в любую ветку → короткий SHA коммита (например a1b2c3d);
#   - push git-тега v* → имя тега (v1.2.3) и дополнительно :latest;
#   - workflow_dispatch → произвольный тег из input.
# После push git-тега v* создаётся черновик GitHub Release с перечислением образов и дайджестов.
# Опционально зеркалирует те же манифесты в Docker Hub (без повторной сборки).
#
# Триггеры: push в любую ветку, push тега v*, workflow_dispatch.
#
# Настройка Docker Hub (репозиторий → Settings → Secrets and variables → Actions):
#   Variables: DOCKERHUB_IMAGE_PREFIX = myuser/openvpn-control
#   Secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
#
# GHCR: ghcr.io/<owner>/<repo>-{backend,frontend}

name: Docker publish

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Тег образов (например v1.0.0 или latest)"
        required: true
        default: "latest"

env:
  REGISTRY: ghcr.io

permissions:
  contents: write
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image names (GHCR, lowercase)
        run: |
          owner_repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_BACKEND=${{ env.REGISTRY }}/${owner_repo}-backend" >> "$GITHUB_ENV"
          echo "IMAGE_FRONTEND=${{ env.REGISTRY }}/${owner_repo}-frontend" >> "$GITHUB_ENV"

      - name: Optional Docker Hub targets
        id: hub
        run: |
          prefix="${{ vars.DOCKERHUB_IMAGE_PREFIX }}"
          if [ -n "$prefix" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "backend=docker.io/${prefix}-backend" >> "$GITHUB_OUTPUT"
            echo "frontend=docker.io/${prefix}-frontend" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            short_sha="$(echo "${GITHUB_SHA}" | cut -c1-7)"
            echo "value=${short_sha}" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub (optional)
        if: steps.hub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta (backend)
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BACKEND }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.value }}
            type=raw,value=latest,enable=${{ steps.tag.outputs.is_release == 'true' && startsWith(steps.tag.outputs.value, 'v') }}
          flavor: |
            latest=false

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker meta (frontend)
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_FRONTEND }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.value }}
            type=raw,value=latest,enable=${{ steps.tag.outputs.is_release == 'true' && startsWith(steps.tag.outputs.value, 'v') }}
          flavor: |
            latest=false

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Mirror to Docker Hub (optional)
        if: steps.hub.outputs.enabled == 'true'
        env:
          TAG: ${{ steps.tag.outputs.value }}
          SRC_BACKEND: ${{ env.IMAGE_BACKEND }}
          SRC_FRONTEND: ${{ env.IMAGE_FRONTEND }}
          DST_BACKEND: ${{ steps.hub.outputs.backend }}
          DST_FRONTEND: ${{ steps.hub.outputs.frontend }}
        run: |
          set -eux
          docker buildx imagetools create --tag "${DST_BACKEND}:${TAG}" "${SRC_BACKEND}:${TAG}"
          docker buildx imagetools create --tag "${DST_FRONTEND}:${TAG}" "${SRC_FRONTEND}:${TAG}"
          if [[ "${{ steps.tag.outputs.is_release }}" == "true" && "${TAG}" == v* ]]; then
            docker buildx imagetools create --tag "${DST_BACKEND}:latest" "${SRC_BACKEND}:${TAG}"
            docker buildx imagetools create --tag "${DST_FRONTEND}:latest" "${SRC_FRONTEND}:${TAG}"
          fi

      - name: Draft release (образы в GHCR)
        if: github.event_name == 'push' && steps.tag.outputs.is_release == 'true'
        env:
          TAG: ${{ steps.tag.outputs.value }}
          IMAGE_BACKEND: ${{ env.IMAGE_BACKEND }}
          IMAGE_FRONTEND: ${{ env.IMAGE_FRONTEND }}
        run: |
          set -eux
          digest_backend="$(docker buildx imagetools inspect "${IMAGE_BACKEND}:${TAG}" | awk '/Digest:/ {print $2; exit}')"
          digest_frontend="$(docker buildx imagetools inspect "${IMAGE_FRONTEND}:${TAG}" | awk '/Digest:/ {print $2; exit}')"
          {
            echo "## Образы (GHCR)"
            echo
            echo "Тег образов: \`${TAG}\`"
            if [[ "${TAG}" == v* ]]; then
              echo "Для тегов \`v*\` также обновлён тег \`latest\`."
            fi
            echo
            echo "### Backend (Go)"
            echo "- \`${IMAGE_BACKEND}:${TAG}\`"
            echo "- digest: \`${digest_backend}\`"
            echo
            echo "### Frontend"
            echo "- \`${IMAGE_FRONTEND}:${TAG}\`"
            echo "- digest: \`${digest_frontend}\`"
            echo
            echo "### Пример pull"
            echo "\`\`\`"
            echo "docker pull ${IMAGE_BACKEND}:${TAG}"
            echo "docker pull ${IMAGE_FRONTEND}:${TAG}"
            echo "\`\`\`"
          } > release-body.md
          {
            echo "BACKEND_IMAGE=${IMAGE_BACKEND}:${TAG}"
            echo "BACKEND_DIGEST=${digest_backend}"
            echo "FRONTEND_IMAGE=${IMAGE_FRONTEND}:${TAG}"
            echo "FRONTEND_DIGEST=${digest_frontend}"
          } > container-images.env

      - name: Publish draft release
        if: github.event_name == 'push' && steps.tag.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: ${{ steps.tag.outputs.value }}
          draft: true
          body_path: release-body.md
          files: container-images.env
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
